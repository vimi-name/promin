name: alpha4-standard-validation

# Windows is the only locally verified alpha.4 runtime/deployment surface.
# Ubuntu and macOS execute static package/authority checks only.  They do not
# initialize a project, install a candidate for acceptance, or grant any
# deployment, installability, acceptance, or pass-credit claim.

on:
  push:
    branches: [alpha, alpha-1.0.0-alpha.4, beta, main]
  pull_request:

jobs:
  declared-platform-static-validation:
    # Linux/macOS are intentionally static-only until host-specific evidence
    # is captured and reviewed.  This lane must never be read as deployment.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies for static checks
        run: python -m pip install -e ".[test]"
      - name: Static standard/package checks only
        env:
          PROMIN_NO_TELEMETRY: '1'
        run: |
          python tools/promin_validate.py . --install-mode none
          python -m pytest -q tests/test_alpha4_genericity.py tests/test_alpha4_static_admission.py tests/test_alpha4_selector_shards.py tests/test_alpha3_reconciliation_static.py

  windows-aliased-paths:
    # Windows is the current alpha.4 runtime verification priority.  Even this
    # regression lane cannot award installability, product acceptance, release,
    # or pass credit without a separately reviewed candidate artifact.
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exactly through a README-style venv
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "promin-readme-venv"
          python -m venv $venv
          $python = Join-Path $venv "Scripts/python.exe"
          $promin = Join-Path $venv "Scripts/promin.exe"
          & $python -m pip install ".[test]"
          "PROMIN_TEST_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROMIN_TEST_EXE=$promin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Create aliased TEMP and cache roots
        shell: pwsh
        run: |
          $physicalTemp = Join-Path $env:RUNNER_TEMP "promin-physical-temp"
          $physicalCache = Join-Path $env:RUNNER_TEMP "promin-physical-cache"
          $aliasTemp = Join-Path $env:RUNNER_TEMP "promin-temp-alias"
          $aliasCache = Join-Path $env:RUNNER_TEMP "promin-cache-alias"
          New-Item -ItemType Directory -Force -Path $physicalTemp,$physicalCache | Out-Null
          cmd /c "mklink /J `"$aliasTemp`" `"$physicalTemp`"" | Out-Null
          cmd /c "mklink /J `"$aliasCache`" `"$physicalCache`"" | Out-Null
          $shortTemp = (cmd /c "for %I in (`"$physicalTemp`") do @echo %~sI").Trim()
          $selectedTemp = if ($shortTemp -and ($shortTemp -ne $physicalTemp)) { $shortTemp } else { $aliasTemp }
          "PROMIN_ALIAS_TEMP=$selectedTemp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROMIN_ALIAS_CACHE=$aliasCache" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run Windows native publication and identity checks
        shell: pwsh
        env:
          PROMIN_NO_TELEMETRY: '1'
        run: |
          $env:TEMP = $env:PROMIN_ALIAS_TEMP
          $env:TMP = $env:PROMIN_ALIAS_TEMP
          $env:LOCALAPPDATA = $env:PROMIN_ALIAS_CACHE
          Remove-Item Env:PROMIN_PROVIDER_STORE -ErrorAction SilentlyContinue
          & $env:PROMIN_TEST_PYTHON -m pytest -q tests/test_alpha4_windows_publication.py tests/test_alpha4_recovery_locks.py tests/test_alpha4_extensions_clean_init.py tests/test_alpha3_reconciliation_windows.py tests/test_alpha3_reconciliation_aliased_temp_tree.py
      - name: Validate the static package without installability credit
        shell: pwsh
        env:
          PROMIN_NO_TELEMETRY: '1'
        run: |
          & $env:PROMIN_TEST_PYTHON tools/promin_validate.py . --install-mode none
