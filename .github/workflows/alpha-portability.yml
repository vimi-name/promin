name: alpha-portability

on:
  push:
    branches: [alpha, beta, main]
  pull_request:

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Opus 5 closure regression suite
        env:
          PROMIN_NO_TELEMETRY: '1'
        run: python -m pytest -q tests/test_alpha3_opus_closure.py
      - name: Focused non-scale corpus
        env:
          PROMIN_NO_TELEMETRY: '1'
        run: python -m pytest -q -m "not scale"

  windows-aliased-paths:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Create aliased TEMP and cache roots
        shell: pwsh
        run: |
          $physicalTemp = Join-Path $env:RUNNER_TEMP "promin-physical-temp"
          $physicalCache = Join-Path $env:RUNNER_TEMP "promin-physical-cache"
          $aliasTemp = Join-Path $env:RUNNER_TEMP "promin-temp-alias"
          $aliasCache = Join-Path $env:RUNNER_TEMP "promin-cache-alias"
          New-Item -ItemType Directory -Force -Path $physicalTemp,$physicalCache | Out-Null
          cmd /c "mklink /J `"$aliasTemp`" `"$physicalTemp`"" | Out-Null
          cmd /c "mklink /J `"$aliasCache`" `"$physicalCache`"" | Out-Null
          "PROMIN_ALIAS_TEMP=$aliasTemp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROMIN_ALIAS_CACHE=$aliasCache" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run aliased-path regression and real init
        shell: pwsh
        env:
          PROMIN_NO_TELEMETRY: '1'
        run: |
          $env:TEMP = $env:PROMIN_ALIAS_TEMP
          $env:TMP = $env:PROMIN_ALIAS_TEMP
          $env:LOCALAPPDATA = $env:PROMIN_ALIAS_CACHE
          Remove-Item Env:PROMIN_PROVIDER_STORE -ErrorAction SilentlyContinue
          python -m pytest -q tests/test_alpha3_opus_closure.py
          $project = Join-Path $env:RUNNER_TEMP ("promin-" + ("x" * 140))
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          promin --root $project init --goal "Windows aliased path regression" --yes
          promin --root $project doctor --checklist

  macos-aliased-paths:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run symlinked temp/cache regression
        env:
          PROMIN_NO_TELEMETRY: '1'
        run: |
          physical_temp="$RUNNER_TEMP/promin-physical-temp"
          alias_temp="$RUNNER_TEMP/promin-temp-alias"
          physical_cache="$RUNNER_TEMP/promin-physical-cache"
          alias_cache="$RUNNER_TEMP/promin-cache-alias"
          mkdir -p "$physical_temp" "$physical_cache"
          ln -s "$physical_temp" "$alias_temp"
          ln -s "$physical_cache" "$alias_cache"
          export TMPDIR="$alias_temp"
          export PROMIN_PROVIDER_STORE="$alias_cache/provider-store-v1"
          python -m pytest -q tests/test_alpha3_opus_closure.py
          project="$RUNNER_TEMP/promin-macos-alias-project"
          mkdir -p "$project"
          promin --root "$project" init --goal "macOS aliased path regression" --yes
          promin --root "$project" doctor --checklist
