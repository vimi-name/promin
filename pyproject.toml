[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "promin"
version = "1.0.0a4"
description = "Promin Standard operational standard"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
dependencies = [
  "cryptography>=44,<47",
  "jsonschema>=4.20,<5",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
docs = [
  "reportlab>=4.2,<5",
]
test = [
  "pytest>=8,<10",
]

[project.scripts]
promin = "promin.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["promin*"]

[tool.setuptools.data-files]
"share/promin" = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "VERSION.json"]
"share/promin/core" = ["core/*.json"]
"share/promin/presets" = ["presets/*.json"]
"share/promin/profiles" = ["profiles/*.json", "profiles/README.md"]
"share/promin/capability_profiles" = ["capability_profiles/*.json"]
"share/promin/language_profiles" = ["language_profiles/*.json"]
"share/promin/skills" = ["skills/README.md", "skills/skill.schema.json"]
"share/promin/skills/example" = ["skills/example/SKILL.md", "skills/example/promin.skill.json"]
"share/promin/prompts" = ["prompts/*.txt"]

[tool.pytest.ini_options]
markers = [
  "performance: bounded local command-cost contract measurements",
  "scale: physical 100k runtime saturation",
  "windows_integration: real Windows CLI init and portability route",
]
